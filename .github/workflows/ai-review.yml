name: AI Code Review

on:
  # 触发时机：PR 创建时 + PR 分支推送新代码时
  push:
    branches:
      - feature     # 你们的共享开发分支名，按实际改
      - dev         # 如果有多个共享分支，都列上

permissions:
  contents: write        # 允许把审查报告 push 回 PR 分支
  pull-requests: write   # 允许操作 PR

jobs:
  review:
    runs-on: ubuntu-latest
    # 关键：跳过 [skip review] 提交，防止死循环
    if: ${{ !contains(github.event.head_commit.message, '[skip review]') }}

    steps:
      - name: 拉取代码（含完整历史，为了算 diff）
        uses: actions/checkout@v4
        with:
          # 检出 PR 分支本身（不是 merge commit），这样后面才能 push 报告
          # ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0   # 必须拉全量历史，否则 git diff 算不出变更

      # - name: 拉取 main 分支（作为 diff 对比基准）
      #   run: git fetch origin main

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 运行 AI 代码审查
        env:
          BEFORE_SHA: ${{ github.event.before }}
          AFTER_SHA: ${{ github.event.after }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: node scripts/ai-review.mjs